name: Build Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: |
          # Remove 'v' prefix from tag (v1.0.0 -> 1.0.0)
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Plugin version: ${VERSION}"

      - name: Verify version numbers agree
        env:
          TAG_VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          set -euo pipefail

          # The updater compares the plugin header against the tag, so a header
          # left behind produces a permanent false "update available" notice.
          HEADER_VERSION=$(sed -n 's/^ \* Version:[[:space:]]*\(.*\)$/\1/p' gp-elements-page-conditions.php | head -1 | tr -d '[:space:]')
          CONSTANT_VERSION=$(sed -n "s/^const HWPC_VERSION[[:space:]]*=[[:space:]]*'\(.*\)';[[:space:]]*$/\1/p" gp-elements-page-conditions.php | head -1 | tr -d '[:space:]')
          README_VERSION=$(sed -n 's/^Stable tag:[[:space:]]*\(.*\)$/\1/p' readme.txt | head -1 | tr -d '[:space:]')

          echo "Git tag ................ ${TAG_VERSION}"
          echo "Plugin header .......... ${HEADER_VERSION}"
          echo "HWPC_VERSION ........... ${CONSTANT_VERSION}"
          echo "readme.txt stable tag .. ${README_VERSION}"

          VERSION_MISMATCH=0
          for CANDIDATE_VERSION in "${HEADER_VERSION}" "${CONSTANT_VERSION}" "${README_VERSION}"; do
            if [ "${CANDIDATE_VERSION}" != "${TAG_VERSION}" ]; then
              VERSION_MISMATCH=1
            fi
          done

          if [ "${VERSION_MISMATCH}" -ne 0 ]; then
            echo "::error::Version mismatch. The plugin header, HWPC_VERSION and the readme.txt stable tag must all read ${TAG_VERSION}."
            exit 1
          fi

          echo "All version numbers agree on ${TAG_VERSION}."

      - name: Prepare plugin directory
        run: |
          mkdir -p build
          rsync -av --exclude-from=.distignore ./ build/gp-elements-page-conditions/

      - name: Build release zips
        # Build the versioned zip once, then copy it to the generic
        # filename so both artifacts are byte-identical.
        run: |
          cd build
          zip -r gp-elements-page-conditions-${{ steps.get_version.outputs.version }}.zip gp-elements-page-conditions/
          cp gp-elements-page-conditions-${{ steps.get_version.outputs.version }}.zip gp-elements-page-conditions.zip
          cd ..

      - name: Upload versioned zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: gp-elements-page-conditions-${{ steps.get_version.outputs.version }}
          path: build/gp-elements-page-conditions-${{ steps.get_version.outputs.version }}.zip

      - name: Upload generic zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: gp-elements-page-conditions
          path: build/gp-elements-page-conditions.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/gp-elements-page-conditions-${{ steps.get_version.outputs.version }}.zip
            build/gp-elements-page-conditions.zip
          body: |
            **GP Elements Page Conditions v${{ steps.get_version.outputs.version }}**

            Adds a paging condition to GeneratePress Premium Elements.

            Download `gp-elements-page-conditions.zip` and install via WordPress admin (Plugins → Add New → Upload Plugin), or upload to your `wp-content/plugins/` directory.

            Sites running 1.1.0 or later receive this update automatically via the in-plugin GitHub updater.

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for full release notes.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
